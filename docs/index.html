<!DOCTYPE html>
<script src="https://d3js.org/d3.v7.min.js"></script>
<html>
    <head>
        <meta charset="UTF-8">
        <title>MLB Pitching Visualization</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <h1>Changes in MLB Pitching: A Visualization</h1>
        <figure>
            <p>
                Major League Baseball has been around since 1876. Like most things that have been around that long, 
                the game has changed and evolved over time. In 2008, MLB began tracking individual pitch data. This 
                became known as Statcast, and is one of the most prolific data gathering efforts we have seen in sports.
                <br>
                This is an interactive presentation of what we have learned and observed about pitching in MLB since 2008
                when Statcast began to publish pitch velocity and pitch type information.
                <br>
                The presentation begins by looking at how the number of pitchers used per season has changed since 2008.
            </p>
            <button onclick="slide1()" class="begin-button">Begin Presentation</button>
            <button onclick="explore_tj()">DEBUG Skip to Explore</button> 
        </figure>
        
        <script>

            const chart_width = window.innerWidth * .75;
            const chart_height = window.innerHeight * .70;
            const chart_margin = 25;
            function range(start, end) {
                return Array.from({length: end - start + 1}, 
                    (_, index) => start + index);
            }

            function clean_page() {
                const chart = document.querySelector("figure");
                if (chart) {
                    chart.innerHTML = "";
                }
                const header = document.querySelector("h1");
                if (header) {
                    header.remove();
                }
                const buttons = document.querySelector("div");
                if (buttons) {
                    buttons.remove();
                }
            }

            function clean_textbox() {
                d3.select(".textbox").remove();
            }

            function lookup(key, value, data) {
                let result = {};
                data.forEach(json_obj => {
                    if (json_obj[key] == value) {
                        result = json_obj;
                    }
                });
                return result;
            }

            async function load_tj_data(interactive) {
                const chart = document.querySelector("figure");
                if (chart) {
                    chart.innerHTML = "<svg class=\"chart\"></svg>";
                }
                const tj_data = await d3.csv("tjdb.csv");
                // x domain is the range of years
                const x_domain_arr = range(d3.min(tj_data, d => +d.Year), d3.max(tj_data, d => +d.Year));
                // y domain is 0 to the max surgery val in a year
                const y_domain_arr = [0, d3.max(tj_data, d => +d.TJSurgeries)];
                
                // Calculate scales
                const x_scale = d3.scaleBand()
                    .domain(x_domain_arr)
                    .range([0,chart_width]);

                const y_scale = d3.scaleLinear()
                    .domain(y_domain_arr)
                    .range([chart_height,0]);
                
                // make the base chart
                d3.select(".chart")
                  .attr("width", chart_width + 50)
                  .attr("height", chart_height + 50)
                  .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                  .selectAll("rect")
                  .data(tj_data)
                  .enter().append("rect")
                  .attr("width", x_scale.bandwidth)
                  .attr("height", function(d){ return chart_height - y_scale(d.TJSurgeries); })
                  .attr("x", function(d){ return x_scale(Number(d.Year)); })
                  .attr("y", function(d){ return y_scale(Number(d.TJSurgeries)); })
                  .on("mouseover", function(event, d) {
                    if (interactive) {
                        const tooltip = `Season: ${d.Year}
                        Number of Surgeries: ${d.TJSurgeries}
                        `;
                        generate_textbox(tooltip, [200, 100], d3.pointer(event));
                        d3.select(this)
                        //   .attr("filter", "drop-shadow(-3px -3px 4px black) drop-shadow(3px -3px 4px black)")
                          .style("fill", "skyblue");
                    }
                  })
                  .on("mouseout", function(event, d) {
                    if (interactive) {
                        clean_textbox();
                        d3.select(this)
                          .attr("filter", "none")
                          .style("fill", "steelblue");
                    }
                });

                // add axes
                d3.select(".chart").append("g")
                  .attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                  .call(d3.axisLeft(y_scale));
                
                d3.select(".chart").append("g")
                  .attr("transform", `translate(${chart_margin}, ${chart_height+chart_margin})`)
                  .call(d3.axisBottom(x_scale).tickValues([1974, 1980, 1990, 2000, 2010, 2020, 2026]));

                //add page header
                d3.select("body")
                  .insert("h1", ":first-child")
                  .html("UCL Reconstruction Surgeries over Time");
            }

            async function explore_tj() {
                clean_page();
                load_tj_data(true);
                explore_buttons();
                const tj_data = await d3.csv("tjdb.csv");
            }

            async function load_pitcher_data(interactive) {
                const chart = document.querySelector("figure");
                if (chart) {
                    chart.innerHTML = "<svg class=\"chart\"></svg><svg class=\"legend\"></svg>";
                }
                const p_data = await d3.csv("pitchers.csv");
                // x domain is the range of years
                const x_domain_arr_p = range(d3.min(p_data, d => +d.Year), d3.max(p_data, d => +d.Year));
                // x domain for the line is slightly different
                const x_domain_arr_i = [d3.min(p_data, d => +d.Year), d3.max(p_data, d => +d.Year)];
                // y domain for bars is custom. 400 to max so the bars take up a good amount of the page
                const y_domain_arr_p = [400, d3.max(p_data, d => +d.TotalPitchers)];
                // y domain for line will be innings pitched. This will be overlayed on the bars but have its own scale
                const y_domain_arr_i = [20, 75];

                // Calculate scales
                const x_scale_p = d3.scaleBand()
                    .domain(x_domain_arr_p)
                    .range([0,chart_width]);

                const y_scale_p = d3.scaleLinear()
                    .domain(y_domain_arr_p)
                    .range([chart_height,0]);
                
                const x_scale_i = d3.scaleLinear()
                    .domain(x_domain_arr_i)
                    .range([0 + (x_scale_p.bandwidth() / 2), chart_width - (x_scale_p.bandwidth() / 2)]);
    
                const y_scale_i = d3.scaleLinear()
                    .domain(y_domain_arr_i)
                    .range([chart_height,0]);

                const tooltip = d3.select("#tooltip")
                // make the bar chart
                d3.select(".chart")
                  .attr("width", chart_width + 50)
                  .attr("height", chart_height + 50)
                  .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                  .selectAll("rect")
                  .data(p_data)
                  .enter().append("rect")
                  .attr("width", x_scale_p.bandwidth)
                  .attr("height", function(d){ return chart_height - y_scale_p(d.TotalPitchers); })
                  .attr("x", function(d){ return x_scale_p(Number(d.Year)); })
                  .attr("y", function(d){ return y_scale_p(Number(d.TotalPitchers)); })
                  .on("mouseover", function(event, d) {
                    if (interactive) {
                        const tooltip = `Season: ${d.Year}
                        Pitchers Used: ${d.TotalPitchers}
                        `;
                        generate_textbox(tooltip, [200, 100], d3.pointer(event));
                        d3.select(this)
                          .style("fill", "skyblue");
                    }
                  })
                  .on("mouseout", function(event, d) {
                    if (interactive) {
                        clean_textbox();
                        d3.select(this)
                          .style("fill", "steelblue");
                    }
                  });

                // make and plot the line but need to add the offset for the bar
                const innings = d3.line()
                    .x(d => x_scale_i(d.Year))
                    .y(d => y_scale_i(d.AverageIP));

                d3.select(".chart")
                  .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                  .append("path")
                  .attr("fill", "none")
                  .attr("stroke", "firebrick")
                  .attr("stroke-width", 3)
                  .attr("d", innings(p_data));
                
                if (interactive) {
                    // write a bigger transparent line over top that will generate the tooltip
                    d3.select(".chart")
                    .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                    .append("path")
                    .attr("fill", "none")
                    .style("opacity", "0")
                    .attr("stroke", "firebrick")
                    .attr("stroke-width", 8)
                    .attr("d", innings(p_data))
                    .on("mouseover", function(event, d) {
                        const year = Math.round(x_scale_i.invert(d3.pointer(event)[0]));
                        const entry = lookup("Year", year, p_data)
                        const inn_p = entry.AverageIP
                        const tooltip = `Year: ${year}
                        Average Innings Pitched: ${inn_p}`;
                        generate_textbox(tooltip, [200, 100], d3.pointer(event));
                        d3.select(this)
                          .style("opacity", "1");
                    })
                    .on("mouseout", function(event, d) {
                        clean_textbox();
                        d3.select(this)
                          .style("opacity", "0");
                    });
                }

                // add axes
                d3.select(".chart").append("g")
                  .attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                  .call(d3.axisLeft(y_scale_p));
                
                d3.select(".chart").append("g")
                  .attr("transform", `translate(${chart_width+chart_margin}, ${chart_margin})`)
                  .call(d3.axisRight(y_scale_i));
                
                d3.select(".chart").append("g")
                  .attr("transform", `translate(${chart_margin}, ${chart_height+chart_margin})`)
                  .call(d3.axisBottom(x_scale_p));
                
                // build the legend
                d3.select(".legend")
                  .attr("width", 125)
                  .attr("height", 50)
                  .append("g").attr("transform", `translate(${chart_width+2*chart_margin}, ${chart_margin})`);
                // Line
                d3.select(".legend").append("circle")
                  .attr("cx", 10)
                  .attr("cy", 15)
                  .attr("r", 5)
                  .style("fill", "firebrick");
                d3.select(".legend")
                  .append("text")
                  .attr("x", 21)
                  .attr("y", 20)
                  .text("Innings Pitched");
                // Line
                d3.select(".legend").append("rect")
                  .attr("x", 5)
                  .attr("y", 30)
                  .attr("height", 10).attr("width", 10)
                  .style("fill", "steelblue");
                d3.select(".legend")
                  .append("text")
                  .attr("x", 21)
                  .attr("y", 40)
                  .text("Total Pitchers");

                //add page header
                d3.select("body")
                  .insert("h1", ":first-child")
                  .html("Pitcher Usage over Time");
            }

            async function explore_pitcher() {
                clean_page();
                load_pitcher_data(true);
                explore_buttons();
                const p_data = await d3.csv("pitchers.csv");
            }

            async function load_velocity_data(interactive) {
                const chart = document.querySelector("figure");
                if (chart) {
                    chart.innerHTML = "<svg class=\"chart\"></svg><svg class=\"legend\"></svg>";
                }
                const v_data = await d3.csv("velo.csv");
                const x_domain_arr = [d3.min(v_data, d => d.Year), d3.max(v_data, d => d.Year)];
                const y_domain_arr = [75, 95];
                // calculate scales
                const x_scale = d3.scaleLinear()
                    .domain(x_domain_arr)
                    .range([0,chart_width]);

                const y_scale = d3.scaleLinear()
                    .domain(y_domain_arr)
                    .range([chart_height,0]);

                // line helper functions
                const fastball = d3.line()
                    .x(d => x_scale(d.Year))
                    .y(d => y_scale(d.Average4seam));
                
                const curveball = d3.line()
                    .x(d => x_scale(d.Year))
                    .y(d => y_scale(d.AverageCurve));
                
                const changeup = d3.line()
                    .x(d => x_scale(d.Year))
                    .y(d => y_scale(d.AverageChange));
                
                const slider = d3.line()
                    .x(d => x_scale(d.Year))
                    .y(d => y_scale(d.AverageSlide));

                // define the chart
                d3.select(".chart")
                  .attr("width", chart_width + 50)
                  .attr("height", chart_height + 50)
                  .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`);

                // plot the lines
                d3.select(".chart")
                  .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                  .append("path")
                  .attr("fill", "none")
                  .attr("stroke", "firebrick")
                  .attr("stroke-width", 3)
                  .attr("d", fastball(v_data));
                
                d3.select(".chart")
                  .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                  .append("path")
                  .attr("fill", "none")
                  .attr("stroke", "steelblue")
                  .attr("stroke-width", 3)
                  .attr("d", changeup(v_data));
                
                d3.select(".chart")
                  .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                  .append("path")
                  .attr("fill", "none")
                  .attr("stroke", "goldenrod")
                  .attr("stroke-width", 3)
                  .attr("d", slider(v_data));
                  
                d3.select(".chart")
                  .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                  .append("path")
                  .attr("fill", "none")
                  .attr("stroke", "forestgreen")
                  .attr("stroke-width", 3)
                  .attr("d", curveball(v_data));

                if (interactive) {
                    d3.select(".chart")
                    .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                    .append("path")
                    .attr("fill", "none")
                    .attr("stroke", "firebrick")
                    .attr("stroke-width", 8)
                    .style("opacity", "0")
                    .attr("d", fastball(v_data))
                    .on("mouseover", function(event, d) {
                        const year = Math.round(x_scale.invert(d3.pointer(event)[0]));
                        const entry = lookup("Year", year, v_data)
                        const fast = entry.Average4seam
                        const tooltip = `Year: ${year}
                        Average Fastball Velocity: ${fast}`;
                        generate_textbox(tooltip, [200, 100], d3.pointer(event));
                        d3.select(this)
                          .style("opacity", "1");
                    })
                    .on("mouseout", function(event, d) {
                        clean_textbox();
                        d3.select(this)
                          .style("opacity", "0");
                    });
                    
                    d3.select(".chart")
                    .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                    .append("path")
                    .attr("fill", "none")
                    .attr("stroke", "steelblue")
                    .attr("stroke-width", 8)
                    .style("opacity", "0")
                    .attr("d", changeup(v_data))
                    .on("mouseover", function(event, d) {
                        const year = Math.round(x_scale.invert(d3.pointer(event)[0]));
                        const entry = lookup("Year", year, v_data)
                        const change = entry.AverageChange
                        const tooltip = `Year: ${year}
                        Average Changeup Velocity: ${change}`;
                        generate_textbox(tooltip, [200, 100], d3.pointer(event));
                        d3.select(this)
                          .style("opacity", "1");
                    })
                    .on("mouseout", function(event, d) {
                        clean_textbox();
                        d3.select(this)
                          .style("opacity", "0");
                    });
                    
                    d3.select(".chart")
                    .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                    .append("path")
                    .attr("fill", "none")
                    .attr("stroke", "goldenrod")
                    .attr("stroke-width", 8)
                    .style("opacity", "0")
                    .attr("d", slider(v_data))
                    .on("mouseover", function(event, d) {
                        const year = Math.round(x_scale.invert(d3.pointer(event)[0]));
                        const entry = lookup("Year", year, v_data)
                        const slide = entry.AverageSlide
                        const tooltip = `Year: ${year}
                        Average Slider Velocity: ${slide}`;
                        generate_textbox(tooltip, [200, 100], d3.pointer(event));
                        d3.select(this)
                          .style("opacity", "1");
                    })
                    .on("mouseout", function(event, d) {
                        clean_textbox();
                        d3.select(this)
                          .style("opacity", "0");
                    });
                    
                    d3.select(".chart")
                    .append("g").attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                    .append("path")
                    .attr("fill", "none")
                    .attr("stroke", "forestgreen")
                    .attr("stroke-width", 8)
                    .style("opacity", "0")
                    .attr("d", curveball(v_data))
                    .on("mouseover", function(event, d) {
                        const year = Math.round(x_scale.invert(d3.pointer(event)[0]));
                        const entry = lookup("Year", year, v_data)
                        const curve = entry.AverageCurve
                        const tooltip = `Year: ${year}
                        Average Curveball Velocity: ${curve}`;
                        generate_textbox(tooltip, [200, 100], d3.pointer(event));
                        d3.select(this)
                          .style("opacity", "1");
                    })
                    .on("mouseout", function(event, d) {
                        clean_textbox();
                        d3.select(this)
                          .style("opacity", "0");
                    });
                }
                // plot axes
                d3.select(".chart").append("g")
                  .attr("transform", `translate(${chart_margin}, ${chart_margin})`)
                  .call(d3.axisLeft(y_scale));
                
                d3.select(".chart").append("g")
                  .attr("transform", `translate(${chart_margin}, ${chart_height+chart_margin})`)
                  .call(d3.axisBottom(x_scale).tickFormat(d3.format("d")));
                
                // build the legend
                d3.select(".legend")
                  .attr("width", 125)
                  .attr("height", 90)
                  .append("g").attr("transform", `translate(${chart_width+2*chart_margin}, ${chart_margin})`);
                // Fastball
                d3.select(".legend").append("circle")
                  .attr("cx", 10)
                  .attr("cy", 15)
                  .attr("r", 5)
                  .style("fill", "firebrick");
                d3.select(".legend")
                  .append("text")
                  .attr("x", 21)
                  .attr("y", 20)
                  .text("4 Seam Fastball");
                // Changeup
                d3.select(".legend").append("circle")
                  .attr("cx", 10)
                  .attr("cy", 35)
                  .attr("r", 5)
                  .style("fill", "steelblue");
                d3.select(".legend")
                  .append("text")
                  .attr("x", 21)
                  .attr("y", 40)
                  .text("Changeup");
                // Slider
                d3.select(".legend").append("circle")
                  .attr("cx", 10)
                  .attr("cy", 55)
                  .attr("r", 5)
                  .style("fill", "goldenrod");
                d3.select(".legend")
                  .append("text")
                  .attr("x", 21)
                  .attr("y", 60)
                  .text("Slider");
                // Curveball
                d3.select(".legend").append("circle")
                  .attr("cx", 10)
                  .attr("cy", 75)
                  .attr("r", 5)
                  .style("fill", "forestgreen");
                d3.select(".legend")
                  .append("text")
                  .attr("x", 21)
                  .attr("y", 80)
                  .text("Curveball");

                // Page title
                d3.select("body")
                  .insert("h1", ":first-child")
                  .html("Standard Pitch Velocities over Time");
            }
        
            async function explore_velo() {
                clean_page();
                load_velocity_data(true);
                explore_buttons();
                const v_data = await d3.csv("velo.csv");
            }

            function generate_textbox(display_text, window_size, window_coords, button_obj) {
                const window_w = window_size[0];
                const window_h = window_size[1];
                d3.select("figure")
                  .insert("svg", ":first-child").attr("class", "textbox")
                  .attr("width", window_size[0])
                  .attr("height", window_size[1])
                  .style("left", window_coords[0] + chart_margin)
                  .style("top", window_coords[1] + chart_margin);
                
                const text_w = window_w - 14;
                const text_h = window_h - 20;
                d3.select(".textbox")
                  .append("foreignObject")
                  .attr("x", 7).attr("y", 10)
                  .attr("width", text_w).attr("height", text_h)
                  .append("xhtml:text")
                  .text(display_text);
                
                if (button_obj) {
                    const button_x = (text_w - button_obj.width) / 2;
                    const button_y = text_h - button_obj.height + 5;
                    d3.select(".textbox")
                      .append("foreignObject")
                      .attr("x", button_x).attr("y", button_y)
                      .attr("width", button_obj.width).attr("height", button_obj.height)
                      .append("xhtml:button")
                      .text(button_obj.text)
                      .attr("onclick", button_obj.fn);
                }
            }

            async function slide1() {
                clean_page();
                load_pitcher_data(false);
                const box_text = `
                    This chart shows how the number of pitchers has changed overtime, alongside how many innings each pitcher throws on average.
                    Since 2008, the usage has steadily grown year over year, showing that the days of high-endurance starters throwing complete games have passed.
                    The modern game favors bullpen usage. Analytics indicate that it is harder for opposing batters to produce when the pitcher is new.
                `;
                const next_button = {
                    "width": 44,
                    "height": 22,
                    "text": "Next",
                    "fn": "slide1a();"
                };
                generate_textbox(box_text, [400, 235], [.35*chart_width, .43*chart_height], next_button);    
            }

            function slide1a() {
                clean_textbox();
                const box_text = `
                    The bars indicate the total number of pitchers used in a season.
                    This includes starters, relievers, and the rare case when a position player comes in to pitch in relief.
                    In 2008, around 650 unique pitchers made an appearance. Last season in 2025, that number ballooned to around 875.
                    Note that in the COVID-19 impacted season of 2020, we still observed more pitchers than in 2008, showing how much the strategy has shifted.
                `;
                const next_button = {
                    "width": 44,
                    "height": 22,
                    "text": "Next",
                    "fn": "slide1b();"
                };
                generate_textbox(box_text, [400, 250], [.15*chart_width, .15*chart_height], next_button); 
            }

            function slide1b() {
                clean_textbox();
                const box_text = `
                    The line indicates the average innings pitched per pitcher that season.
                    The downward trend is quite intutive, because we can see the number of pitchers drastically grow, and the length of the game has maintained steadily at 9 innings per game.
                    The MLB season has been set at 162 games per team since 1961 after the American League expanded. The only contradiction to this was in the COVID-19 impacted 2020 season, when only 60 games were played per team.
                    This creates an interesting outlier when observing this metric calculated in this way.          
                `;
                const next_button = {
                    "width": 85,
                    "height": 22,
                    "text": "Next Slide",
                    "fn": "slide2();"
                };
                generate_textbox(box_text, [475, 250], [.125*chart_width, .6*chart_height], next_button); 
            }

            async function slide2() {
                clean_page();
                load_velocity_data(false);
                const box_text = `
                    Since 2008, when Statcast began to publish pitch usage data, among the most common pitches have been the 4 Seam Fastball, Changeup, Slider, and Curveball. 
                    The 4 Seam Fastball is the standard pitch, relying on velocity and location to best the batter. 
                    A Changeup uses deception of the same arm motion as a fastball, yet drastically lower velocity. This is called an "offspeed" pitch. 
                    The Slider and Curveball use spin to have horizontal (Slider) or vertical (Curveball) movement when compared to the fastball, which doesn't move much. These are referred to as "breaking balls". 
                    A pitcher may use some, all or none of these 4 pitches, as other pitch types and hybrids exist, but almost all pitchers use some combination of fastballs, offspeeds, and breaking balls.
                `;
                const next_button = {
                    "width": 44,
                    "height": 22,
                    "text": "Next",
                    "fn": "slide2a();"
                };
                generate_textbox(box_text, [500, 320], [.35*chart_width, .4*chart_height], next_button); 
            }

            function slide2a() {
                clean_textbox();
                const box_text = `
                    This red line indicates the change in average 4 Seam Fastball velocity over time.
                    In 2008, the average 4 seamer clocked 91.6 MPH. Last year in 2025, that was up to 94.5, with some pitchers averaging 100 MPH or more.
                    Note that this line is not the fastest ball thrown that season, but rather the average pitch velocity.
                `;
                const next_button = {
                    "width": 44,
                    "height": 22,
                    "text": "Next",
                    "fn": "slide2b();"
                };
                generate_textbox(box_text, [600, 150], [.3*chart_width, .25*chart_height], next_button); 
            }

            function slide2b() {
                clean_textbox();
                const box_text = `
                    The blue line indicates the change in average Changeup velocity over time, and the yellow line the Slider.
                    From 2008 to 2016 these pitchese were quite similar in velocity, but after 2016 the slider tended slower.
                    This is interesting because in 2015, Statcast began publishing Spin Rate statistics. 
                    This could potentially imply that after those statistics became available, pitchers began focusing on spinning their sliders for more break and less velocity, but since we dont have the data since 2008, we can't say that for sure.
                    In any case, both pitches are still being thrown faster now than before.
                `;
                const next_button = {
                    "width": 44,
                    "height": 22,
                    "text": "Next",
                    "fn": "slide2c();"
                };
                generate_textbox(box_text, [600, 225], [.3*chart_width, .30*chart_height], next_button); 
            }

            function slide2c() {
                clean_textbox();
                const box_text = `
                    The green line is the change in average Curveball velocity. This is the slowest pitch of these four.
                    The Curveball's emphasis on spin and vertical movement mean that throwing it hard is not necessarily as important as throwing it properly.
                    Its average velocity has increased from 76.3 MPH in 2008 to 79.7 last year in 2025.
                `;
                const next_button = {
                    "width": 44,
                    "height": 22,
                    "text": "Next",
                    "fn": "slide2d();"
                };
                generate_textbox(box_text, [425, 185], [.4*chart_width, .66*chart_height], next_button); 
            }

            function slide2d() {
                clean_textbox();
                const box_text = `
                    All 4 of these lines show the same trend: Since 2008, pitches are coming in faster and faster.
                    When combined with the previous trend of more pitchers being used per game, the strategy shift becomes very clear.
                    Use more pitchers, so each pitcher needs to throw for less innings, meaning they can throw harder on every pitch.
                    This means the fastballs will be faster, the breaking balls will have more break, and the batters will have a harder time hitting the ball.
                    However, this doesn't come without consequence.
                `;
                const next_button = {
                    "width": 85,
                    "height": 22,
                    "text": "Next Slide",
                    "fn": "slide3();"
                };
                generate_textbox(box_text, [600, 200], [.3*chart_width, .25*chart_height], next_button); 
            }

            async function slide3() {
                clean_page();
                load_tj_data(false);

                const box_text = `
                    This chart shows the amount of ulnar collateral ligament (UCL) Reconstruction surgeries that have taken place over time.
                    This form of elbow reconstruction surgery is often called "Tommy John" surgery, after the name of the first recipient.
                    See the "sources" link on the home page to learn more about this dataset.
                    This chart concerns only AA and AAA Minor League pitchers and MLB pitchers at the time of surgery. This is because pitchers at those levels are the most relevant to the organization.
                    Players flow from one AA team into one AAA team into one MLB team as their skills increase.
                `;
                const next_button = {
                    "width": 44,
                    "height": 22,
                    "text": "Next",
                    "fn": "slide3a();"
                };
                generate_textbox(box_text, [600, 225], [.3*chart_width, .25*chart_height], next_button); 
            }

            function slide3a() {
                clean_textbox();
                const box_text = `
                    Pitching is incredibly stressful on the body, especially the elbow. The UCL is at a severe risk of overuse injury in baseball players, pitchers especially.
                    In 1974, the Los Angeles Dodger Tommy John was the first to undergo UCL reconstruction to restore his throwing arm. 
                    He went on to play for another 14 seasons for a 26 season career.
                `;
                const next_button = {
                    "width": 44,
                    "height": 22,
                    "text": "Next",
                    "fn": "slide3b();"
                };
                generate_textbox(box_text, [425, 195], [.08*chart_width, .7*chart_height], next_button); 
            }

            function slide3b() {
                clean_textbox();
                const box_text = `
                    After Tommy John's success story, the procedure remained relatively rare throughout the 1980s and 1990s.
                    It was not until 1999 that we saw more than 10 surgeries in pitchers AA or higher.
                `;
                const next_button = {
                    "width": 44,
                    "height": 22,
                    "text": "Next",
                    "fn": "slide3c();"
                };
                generate_textbox(box_text, [375, 150], [.11*chart_width, .63*chart_height], next_button); 
            }

            function slide3c() {
                clean_textbox();
                const box_text = `
                    By the year 2000, Tommy John surgery had become a much more standardized procedure.
                    The surgeries per year in the 2000s approximately doubled what we saw in the 1990s.
                    Doctors got better, the recovery times improved, and pitchers were back on the field to revitalize careers and success for their ball clubs.
                `;
                const next_button = {
                    "width": 44,
                    "height": 22,
                    "text": "Next",
                    "fn": "slide3d();"
                };
                generate_textbox(box_text, [425, 175], [.24*chart_width, .50*chart_height], next_button); 
            }

            function slide3d() {
                clean_textbox();
                const box_text = `
                    In 2008, the anchor fixation technique improved such that UCL repair was a much mmore viable option than full reconstruction.
                    As a result we can see through the 2010s and 2020s the numbers are higher than anyone in 1974 could have ever imagined.
                    Pitchers may also require a second procedure to fully return to their previous form. This also leads to these high surgery counts.
                `;
                const next_button = {
                    "width": 44,
                    "height": 22,
                    "text": "Next",
                    "fn": "slide3e();"
                };
                generate_textbox(box_text, [475, 200], [.24*chart_width, .36*chart_height], next_button); 
            }

            function slide3e() {
                clean_textbox();
                const box_text = `
                    The drastic increases in Tommy John surgeries isn't inherently a bad thing.
                    An increase in the number of surgeries implies that the procedure itself is safe and effective, representing a victory in sports medicine.
                    However, it is exacerbated by the strategy shift we have observed. With more pitchers throwing harder, there is more opportunity to injure the UCL and require Tommy John surgery.
                    The effects of the shift in pitching stretegy has extended past the lines on the field and into the operating room.
                    Since the surgery is so effective, we are able to see more pitchers return to the field, which in turn will grow that total pitchers mark.
                    Use the button to go to the explore home page, where the three interactive charts are linked, to learn more about how pitching has changed in MLB.
                `;
                const next_button = {
                    "width": 118,
                    "height": 22,
                    "text": "End Presentation",
                    "fn": "home();"
                };
                generate_textbox(box_text, [600, 275], [.32*chart_width, .3*chart_height], next_button); 
            }

            function explore_buttons() {
                d3.select("body")
                  .insert("div", ":first-child")
                  .attr("class", "button-bar")
                
                d3.select(".button-bar")
                  .append("button")
                  .attr("id", "pitchers-button") 
                  .attr("onclick", "explore_pitcher()")
                  .html("Pitchers");

                d3.select(".button-bar")
                  .append("button")
                  .attr("id", "velo-button")
                  .attr("onclick", "explore_velo()")
                  .html("Velocity");

                d3.select(".button-bar")
                  .append("button")
                  .attr("id", "tj-button")
                  .attr("onclick", "explore_tj()")
                  .html("Tommy John");

                d3.select(".button-bar")
                  .append("button")
                  .attr("id", "home-button")
                  .attr("onclick", "home()")
                  .html("Return to Home");
            }

            function home() {
                // This will return to the home page except since the presentation was already completed once
                // the explore options will still be open
                // alongside sources and an option to restart the presentation
                clean_page();
                explore_buttons();
                // we are at home so remove that button
                d3.select("#home-button").remove();

                // Page title
                d3.select("body")
                  .insert("h1", ":first-child")
                  .html("Changes in MLB Pitching: A Visualization");

                d3.select("figure")
                  .append("p")
                  .html(`
                    Thank you for viewing this interactive presentation about the changes in pitching strategy in MLB over recent years.
                    I hope the visualizations informed how the strategy has shifted towards using many pitchers who throw harder.
                    <br>
                    Use the buttons above to resume exploring the charts.
                    <br>
                    Use the buttons below to view the presentation again from the beginning or view the Sources page.
                  `);

                d3.select("figure")
                  .append("div")
                  .attr("class", "bottom-button-bar")
                
                d3.select(".bottom-button-bar")
                  .append("button")
                  .html("Begin Presentation")
                  .attr("onclick", "slide1()");
                
                d3.select(".bottom-button-bar")
                  .append("button")
                  .html("View Sources")
                  .attr("onclick", "sources()");
            }

                clean_page();
                explore_buttons();

                d3.select("head")
                  .append("base")
                  .attr("target", "_blank");
                
                // Page title
                d3.select("body")
                  .insert("h1", ":first-child")
                  .html("Sources and Helpful Links");

                d3.select("figure")
                  .append("p")
                  .html(`
                    Welcome to the sources page. This page includes the sources of the public datasets I used for these visualizations, and some helpful links for some more information. 
                    <br><br>

                    - Hosted by Baseball Reference<br>
                    - This dataset contains the standard pitching statistics for every pitcher that appeared at least once over a given season.<br>
                    - Cleaning/Preprocessing output: The total pitchers used in MLB and the average age and innings pitched per pitcher per year.<br>
                    
                    <strong>Statcast Statistics - Pitch Arsenal</strong> <a href=https://baseballsavant.mlb.com/leaderboard/pitch-arsenals?year=2025&min=q&type=avg_speed&hand=>Link to Dataset</a><br>
                    - Hosted by Baseball Savant<br>
                    - This dataset contains the average pitch velocity per pitch type per pitcher over a given MLB season. This is limited to a Qualified minimum pitch count per pitch type of 2.5 pitches per team game (a pitcher may not play every team game)<br>
                    - Cleaning/Preprocessing output: Average velocity and number of qualified users per year for 4-seam fastball, Changeup, Slider, and Curveball pitch types in MLB.<br>

                    <strong>Tommy John Database</strong> <a href=https://docs.google.com/spreadsheets/d/1gQujXQQGOVNaiuwSN680Hq-FDVsCwvN-3AazykOBON0/edit?usp=sharing>Link to Dataset</a><br>
                    - Cloned locally July 19, 2026 <br>
                    - This database is a compilation of Tommy John surgeries for MLB-associated players that have been confirmed through a published media report of some kind. This is not a completely exhaustive list, as some teams are guarded about releasing TJ related information, and some TJ surgeries go completely unreported. However, this is the most comprehensive single source available online, and considered by the public to be the best resource.<br>
                    - Cleaning/Preprocessing output: Average age per TJ recipient and number of recipients per year, filtering only for AA, AAA, and MLB Pitchers.<br>

                    <br><br>
                    Disclaimer: All opinions and analysis of this presentation are that of my own and are intended for educational purposes only
                `);
            }
